minecraft:
  blasting:
    lore:
    - මෙම භාණ්ඩය පිපිරුම් උදුනක දිය කර
    - ඔබට අවශ්‍ය භාණ්ඩය තනා ගන්න
    name: පිපිරුම් උදුන් වට්ටෝරුව
  campfire:
    lore:
    - මෙම භාණ්ඩය ගිනිමැලයක් මතුපිට දිය කර
    - ඔබට අවශ්‍ය භාණ්ඩය තනා ගන්න
    name: ගිනිමැල වට්ටෝරුව
  furnace:
    lore:
    - මෙම භාණ්ඩය උදුනක දිය කර
    - ඔබට අවශ්‍ය භාණ්ඩය තනා ගන්න
    name: උදුන් වට්ටෝරුව
  shaped:
    lore:
    - මෙම භාණ්ඩය පෙන්වා ඇති පරිදි
    - සාමාන්‍ය තැනීම් මේසයක තනන්න.
    - හැඩය වැදගත් වේ.
    name: හැඩගත් තැනීම් වට්ටෝරුව
  shapeless:
    lore:
    - මෙම භාණ්ඩය පෙන්වා ඇති පරිදි
    - සාමාන්‍ය තැනීම් මේසයක තනන්න.
    - මෙම වට්ටෝරුවට හැඩයක් අවශ්‍ය නැත.
    name: හැඩයක් නැති තැනීම් වට්ටෝරුව
  smithing:
    lore:
    - මෙම භාණ්ඩය පෙන්වා ඇති පරිදි
    - කම්මල් මේසයක් භාවිතයෙන් තනන්න
    name: කම්මල් මේස වට්ටෝරුව
  smoking:
    lore:
    - මෙම භාණ්ඩය දුම් උදුනක දිය කර
    - ඔබට අවශ්‍ය භාණ්ඩය තනා ගන්න
    name: දුම් උදුන් වට්ටෝරුව
  stonecutting:
    lore:
    - මෙම භාණ්ඩය පෙන්වා ඇති පරිදි
    - ගල් කපනයක් භාවිතයෙන් තනන්න
    name: ගල් කපන වට්ටෝරුව
slimefun:
  ancient_altar:
    lore:
    - මෙම භාණ්ඩය පෙන්වා ඇති පරිදි
    - පුරාණ පූජාසනයක් භාවිතයෙන් තනන්න.
    - වැඩිදුර තොරතුරු සඳහා පුරාණ පූජාසනය බලන්න
    name: පුරාණ පූජාසනය
  armor_forge:
    lore:
    - මෙම භාණ්ඩය පෙන්වා ඇති පරිදි
    - සන්නාහ කම්මලයක් භාවිතයෙන් තනන්න
    name: සන්නාහ කම්මලය
  barter_drop:
    lore:
    - මෙම භාණ්ඩය ලබා ගැනීමට රන් කැටි
    - භාවිතයෙන් Piglin සමඟ හුවමාරු කරන්න
    name: Piglin හුවමාරු ලැබීම
  compressor:
    lore:
    - මෙම භාණ්ඩය පෙන්වා ඇති පරිදි
    - සම්පීඩකයක් භාවිතයෙන් තනන්න
    name: සම්පීඩකය
  enhanced_crafting_table:
    lore:
    - මෙම භාණ්ඩය පෙන්වා ඇති පරිදි
    - වැඩිදියුණු තැනීම් මේසයක තනන්න.
    - සාමාන්‍ය තැනීම් මේසයක් ප්‍රමාණවත් නොවේ!
    name: වැඩිදියුණු තැනීම් මේසය
  food_composter:
    lore:
    - මෙම භාණ්ඩය පෙන්වා ඇති පරිදි
    - ආහාර කොම්පෝස්ට් යන්ත්‍රයක් භාවිතයෙන් තනන්න
    name: ආහාර කොම්පෝස්ට් යන්ත්‍රය
  food_fabricator:
    lore:
    - මෙම භාණ්ඩය පෙන්වා ඇති පරිදි
    - ආහාර නිෂ්පාදකයක් භාවිතයෙන් තනන්න
    name: ආහාර නිෂ්පාදකය
  freezer:
    lore:
    - මෙම භාණ්ඩය පෙන්වා ඇති පරිදි
    - ශීතකරණයක් භාවිතයෙන් තනන්න
    name: ශීතකරණය
  geo_miner:
    lore:
    - මෙම භාණ්ඩය GEO පතල්කරුවක්
    - භාවිතයෙන් ලබා ගත හැක
    name: GEO පතල්කරු
  gold_pan:
    lore:
    - මෙම භාණ්ඩය ලබා ගැනීමට
    - රන් තලියක් භාවිත කරන්න
    name: රන් තලිය
  grind_stone:
    lore:
    - මෙම භාණ්ඩය පෙන්වා ඇති පරිදි
    - ඇඹරුම් ගලක් භාවිතයෙන් තනන්න
    name: ඇඹරුම් ගල
  heated_pressure_chamber:
    lore:
    - මෙම භාණ්ඩය පෙන්වා ඇති පරිදි
    - රත් කළ පීඩන කුටියක් භාවිතයෙන් තනන්න
    name: රත් කළ පීඩන කුටිය
  juicer:
    lore:
    - මෙම යුෂ පෙන්වා ඇති පරිදි
    - යුෂ යන්ත්‍රයක් භාවිතයෙන් සාදන්න
    name: යුෂ යන්ත්‍රය
  magic_workbench:
    lore:
    - මෙම භාණ්ඩය පෙන්වා ඇති පරිදි
    - මායා වැඩ මේසයක් භාවිතයෙන් තනන්න
    name: මායා වැඩ මේසය
  mob_drop:
    lore:
    - මෙම භාණ්ඩය ලබා ගැනීමට
    - එම මොන්ස්ටරය මරන්න
    name: මොන්ස්ටර ලැබීම
  multiblock:
    lore:
    - පෙන්වා ඇති ව්‍යුහය එලෙසම
    - ගොඩනගන්න. මෙය තනන එකක් නොවේ.
    name: බහුකැටය
  nuclear_reactor:
    lore:
    - මෙම භාණ්ඩය න්‍යෂ්ටික ප්‍රතික්‍රියාකාරකයක්
    - ක්‍රියාත්මක කිරීමේ අතුරු ඵලයකි
    name: න්‍යෂ්ටික ප්‍රතික්‍රියාකාරකය
  oil_pump:
    lore:
    - මෙම භාණ්ඩය තෙල් පොම්පයක්
    - භාවිතයෙන් ලබා ගත හැක
    name: තෙල් පොම්පය
  ore_crusher:
    lore:
    - මෙම භාණ්ඩය පෙන්වා ඇති පරිදි
    - ලෝපස් පොඩිකරුවක් භාවිතයෙන් තනන්න
    name: ලෝපස් පොඩිකරු
  ore_washer:
    lore:
    - මෙම භාණ්ඩය පෙන්වා ඇති පරිදි
    - ලෝපස් සෝදනයක් භාවිතයෙන් තනන්න
    name: ලෝපස් සෝදනය
  pickaxe_of_containment:
    lore:
    - මෙම කැටය ලබා ගත හැක්කේ
    - අඩස්සි පිකෑස භාවිතයෙන් ස්පෝනරයක්
    - කැණීම මගිනි
    name: අඩස්සි පිකෑස
  pressure_chamber:
    lore:
    - මෙම භාණ්ඩය පෙන්වා ඇති පරිදි
    - පීඩන කුටියක් භාවිතයෙන් තනන්න
    name: පීඩන කුටිය
  refinery:
    lore:
    - මෙම භාණ්ඩය පෙන්වා ඇති පරිදි
    - පිරිපහදුවක් භාවිතයෙන් තනන්න
    name: පිරිපහදුව
  smeltery:
    lore:
    - මෙම භාණ්ඩය පෙන්වා ඇති පරිදි
    - ද්‍රවණාගාරයක් භාවිතයෙන් තනන්න
    name: ද්‍රවණාගාරය
