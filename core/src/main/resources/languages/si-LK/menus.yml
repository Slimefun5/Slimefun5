NUCLEAR_REACTOR:
  '1':
    lore:
    - ''
    - '&fමෙම කුටිය විකිරණශීලී ඉන්ධන පිළිගනී, උදා:'
    - '&2යුරේනියම් &fහෝ &aනෙප්ටියුනියම්'
    name: '&7ඉන්ධන කුටිය'
  '7':
    lore:
    - ''
    - '&fමෙම කුටිය සිසිලන කෝෂ පිළිගනී'
    - '&4සිසිලන කෝෂ නොමැති නම් ඔබේ'
    - '&4ප්‍රතික්‍රියාකාරකය පිපිරී යයි'
    name: '&bසිසිලන කුටිය'
  '4':
    variants:
    - match: '&7Focus: &eElectricity'
      name: '&7අවධානය: &eවිදුලිය'
      lore:
      - ''
      - '&6ඔබේ ප්‍රතික්‍රියාකාරකය විදුලි නිෂ්පාදනයට අවධානය යොමු කරයි'
      - '&6ඔබේ බලශක්ති ජාලයට විදුලිය අවශ්‍ය නැත්නම්'
      - '&6එය කිසිවක් නිපදවන්නේ ද නැත'
      - ''
      - '&7⇨ අවධානය &eනිෂ්පාදනය &7වෙත මාරු කිරීමට ක්ලික් කරන්න'
    - match: '&7Focus: &eProduction'
      name: '&7අවධානය: &eනිෂ්පාදනය'
      lore:
