minecraft:
  blasting:
    lore:
    - Topește acest obiect într-un Furnal
    - pentru a fabrica obiectul dorit
    name: Rețetă de Furnal
  campfire:
    lore:
    - Topește acest obiect la un Foc de Tabără
    - pentru a fabrica obiectul dorit
    name: Rețetă de Foc de Tabără
  furnace:
    lore:
    - Topește acest obiect într-un Cuptor
    - pentru a fabrica obiectul dorit
    name: Rețetă de Cuptor
  shaped:
    lore:
    - Fabrică acest obiect așa cum este arătat
    - într-o Masă de Lucru normală.
    - Forma contează.
    name: Rețetă de Crafting cu Formă
  shapeless:
    lore:
    - Fabrică acest obiect așa cum este arătat
    - într-o Masă de Lucru normală.
    - Această rețetă nu are formă.
    name: Rețetă de Crafting fără Formă
  smithing:
    lore:
    - Fabrică acest obiect așa cum este arătat
    - folosind o Masă de Fierărie
    name: Rețetă de Masă de Fierărie
  smoking:
    lore:
    - Topește acest obiect într-o Afumătoare
    - pentru a fabrica obiectul dorit
    name: Rețetă de Afumătoare
  stonecutting:
    lore:
    - Fabrică acest obiect așa cum este arătat
    - folosind un Tăietor de Piatră
    name: Rețetă de Tăietor de Piatră
