    lore:
    - Κατασκευάστε αυτό το αντικείμενο όπως φαίνεται
    - χρησιμοποιώντας έναν Πάγκο Σιδηρουργίας
    name: Συνταγή Πάγκου Σιδηρουργίας
  smoking:
