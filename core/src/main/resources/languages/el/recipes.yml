    lore:
    - Κατασκευάστε αυτό το αντικείμενο όπως φαίνεται
    - σε έναν κανονικό Πάγκο Κατασκευής.
    - Το σχήμα έχει σημασία.
    name: Συνταγή Κατασκευής με Σχήμα
  shapeless:
    lore:
    - Κατασκευάστε αυτό το αντικείμενο όπως φαίνεται
    - σε έναν κανονικό Πάγκο Κατασκευής.
    - Αυτή η συνταγή δεν έχει συγκεκριμένο σχήμα.
    name: Συνταγή Κατασκευής χωρίς Σχήμα
