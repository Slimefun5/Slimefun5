minecraft:
  blasting:
    lore:
    - Λιώστε αυτό το αντικείμενο σε μια Υψικάμινο
    - για να κατασκευάσετε το επιθυμητό αντικείμενο
    name: Συνταγή Υψικαμίνου
  campfire:
    lore:
    - Λιώστε αυτό το αντικείμενο πάνω σε μια Φωτιά Στρατοπέδευσης
    - για να κατασκευάσετε το επιθυμητό αντικείμενο
    name: Συνταγή Φωτιάς Στρατοπέδευσης
  furnace:
    lore:
    - Λιώστε αυτό το αντικείμενο σε ένα Καμίνι
    - για να κατασκευάσετε το επιθυμητό αντικείμενο
    name: Συνταγή Καμινιού
