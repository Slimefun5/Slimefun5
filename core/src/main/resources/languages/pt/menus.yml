CARGO_NODE_INPUT:
  '2':
    lore:
    - ''
    - '&bColoca todos os Itens que queres'
    - '&blista negra/lista branca'
    name: '&3Itens'
  '15':
    variants:
    - match: '&7Type: &rWhitelist'
      name: '&7Tipo: &rLista branca'
      lore:
      - ''
      - '&e> Clique para mudar para lista negra'
    - match: '&7Type: &8Blacklist'
      name: '&7Tipo: &8Lista negra'
      lore:
      - ''
      - '&e> Clique para mudar para lista branca'
  '16':
    variants:
    - match: '&7"Smart-Filling" Mode: &4✘'
      name: '&7Modo "Preenchimento inteligente": &4✘'
      lore:
      - ''
      - '&e> Clique para ativar o modo "Preenchimento inteligente"'
      - ''
      - '&fNeste modo, o nó de carga tentará'
      - '&fmanter uma quantidade constante de itens'
      - '&fno inventário. Isto não é perfeito'
      - '&fe continuará a preencher espaços vazios'
      - '&fque estejam antes de uma pilha de um item configurado.'
    - match: '&7"Smart-Filling" Mode: &2✔'
      name: '&7Modo "Preenchimento inteligente": &2✔'
      lore:
      - ''
      - '&e> Clique para desativar o modo "Preenchimento inteligente"'
      - ''
      - '&fNeste modo, o nó de carga tentará'
      - '&fmanter uma quantidade constante de itens'
      - '&fno inventário. Isto não é perfeito'
      - '&fe continuará a preencher espaços vazios'
      - '&fque estejam antes de uma pilha de um item configurado.'
  '24':
    variants:
    - match: '&7Round-Robin Mode: &4✘'
      name: '&7Modo rotativo: &4✘'
      lore:
      - ''
      - '&e> Clique para ativar o modo rotativo'
      - '&e(Os itens serão distribuídos igualmente pelo canal)'
    - match: '&7Round-Robin Mode: &2✔'
      name: '&7Modo rotativo: &2✔'
      lore:
      - ''
      - '&e> Clique para desativar o modo rotativo'
      - '&e(Os itens serão distribuídos igualmente pelo canal)'
  '25':
    variants:
    - match: '&7Include Lore: &2✔'
      name: '&7Incluir descrição: &2✔'
      lore:
      - ''
      - '&e> Clique para escolher se a descrição tem de corresponder'
    - match: '&7Include Lore: &4✘'
      name: '&7Incluir descrição: &4✘'
      lore:
      - ''
      - '&e> Clique para escolher se a descrição tem de corresponder'
  '41':
    variants:
    - match: '&bPrevious Channel'
      name: '&bCanal anterior'
      lore:
      - ''
      - '&e> Clique para diminuir o ID do canal em 1'
  '42':
    variants:
    - match: '&bChannel ID: &3{0}'
      name: '&bID do canal: &3{0}'
  '43':
    variants:
    - match: '&bNext Channel'
      name: '&bCanal seguinte'
      lore:
      - ''
      - '&e> Clique para aumentar o ID do canal em 1'
