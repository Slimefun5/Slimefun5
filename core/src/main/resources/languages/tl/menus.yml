CARGO_NODE_INPUT:
  '2':
    lore:
    - ''
    - '&bIlagay dito ang lahat ng item na nais mong'
    - '&bi-blacklist/whitelist'
    name: '&3Mga Item'
  '15':
    variants:
    - match: '&7Type: &rWhitelist'
      name: '&7Uri: &rListahan ng pinapayagan'
      lore:
      - ''
      - '&e> I-click para gawing listahan ng ipinagbabawal'
    - match: '&7Type: &8Blacklist'
      name: '&7Uri: &8Listahan ng ipinagbabawal'
      lore:
      - ''
      - '&e> I-click para gawing listahan ng pinapayagan'
  '16':
    variants:
    - match: '&7"Smart-Filling" Mode: &4✘'
      name: '&7Mode na "Matalinong pagpuno": &4✘'
      lore:
      - ''
      - '&e> I-click para buksan ang "Matalinong pagpuno"'
      - ''
      - '&fSa mode na ito, susubukan ng cargo node'
      - '&fna panatilihing pare-pareho ang dami ng item'
      - '&fsa imbentaryo. Hindi ito perpekto'
      - '&fat pupunuin pa rin ang mga bakanteng slot na'
      - '&fnauuna sa isang stack ng itinakdang item.'
    - match: '&7"Smart-Filling" Mode: &2✔'
      name: '&7Mode na "Matalinong pagpuno": &2✔'
      lore:
      - ''
      - '&e> I-click para isara ang "Matalinong pagpuno"'
      - ''
      - '&fSa mode na ito, susubukan ng cargo node'
      - '&fna panatilihing pare-pareho ang dami ng item'
      - '&fsa imbentaryo. Hindi ito perpekto'
      - '&fat pupunuin pa rin ang mga bakanteng slot na'
      - '&fnauuna sa isang stack ng itinakdang item.'
  '24':
    variants:
    - match: '&7Round-Robin Mode: &4✘'
      name: '&7Mode na halinhinan: &4✘'
      lore:
      - ''
      - '&e> I-click para buksan ang mode na halinhinan'
      - '&e(Pantay na ipamamahagi ang mga item sa channel)'
    - match: '&7Round-Robin Mode: &2✔'
      name: '&7Mode na halinhinan: &2✔'
      lore:
      - ''
      - '&e> I-click para isara ang mode na halinhinan'
      - '&e(Pantay na ipamamahagi ang mga item sa channel)'
  '25':
    variants:
    - match: '&7Include Lore: &2✔'
      name: '&7Isama ang paglalarawan: &2✔'
      lore:
      - ''
      - '&e> I-click para piliin kung dapat tumugma ang paglalarawan'
    - match: '&7Include Lore: &4✘'
      name: '&7Isama ang paglalarawan: &4✘'
      lore:
      - ''
      - '&e> I-click para piliin kung dapat tumugma ang paglalarawan'
  '41':
