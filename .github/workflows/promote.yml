name: Promote experimental to stable

on:
  push:
    tags:
      - "v*"
      - "promote-*"
  workflow_dispatch:

jobs:
  merge:
    permissions:
      contents: write
    uses: intisy/workflows/.github/workflows/merge.yml@main
    with:
      source: experimental
      target: stable
      mode: overwrite

  readme:
    needs: merge
    permissions:
      contents: write
    uses: intisy/workflows/.github/workflows/readme.yml@main
    with:
      repository: ${{ github.repository }}
