# A lightweight, GitHub-only release of the core jar: no Modrinth, no Hangar. Use it for builds that
# addons need to consume via github-gradle but that are not worth a full release.
#
# The trigger is the digit-leading form only. The shared version.gradle strips a leading "v" and
# nothing else, so a gh-v tag passed whole would build Slimefun-gh-v5.2.3.jar.
#
# The full release path (tag v* -> GitHub + Modrinth + Hangar via publish-platforms.yml) is
# unaffected: full releases are v-prefixed, GitHub-only builds are not, so the filters never overlap.
name: Publish to GitHub only

on:
  push:
    tags:
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version to publish (e.g. 5.2.3.1), also used as the release tag'
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    uses: intisy/workflows/.github/workflows/publish.yml@main
    with:
      tag: ${{ inputs.tag }}
      java_version: '21'
      gradle_build: ':core:shadowJar'
      gradle_args: --no-daemon
      release_assets: 'core/build/libs/*.jar'
      release_notes_from_commit: true
      prerelease: true
    secrets:
      envPAT: ${{ secrets.PAT }}
